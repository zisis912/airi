[package]
name = "mc-rust-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
macros = { path = "macros" }
byteorder = "1.5.0"
serde_json = "1.0.151"
hex = "0.4.3"
rsa = "0.9.10"
aes = "0.9.2"
cfb8 = "0.9.1"
flate2 = "1.1.9"
thiserror = "2.0.19"
take_mut = "0.2.2"
tokio = {version = "1.53.1", features = ["io-util"]}
async-compression = { version = "0.4.43", features = ["tokio", "zlib"] }
