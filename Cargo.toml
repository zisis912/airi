[package]
name = "mc-rust-protocol"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/zisis912/mc-rust-protocol"
description = "Full implementation of the Minecraft Network Protocol Spec"
readme = "README.md"
keywords = ["minecraft","protocol","mc"]
categories = ["asynchronous","parsing"]

[dependencies]
macros = {version="0.1.0", path = "macros" }
byteorder = "1.5.0"
serde_json = "1.0.151"
hex = "0.4.3"
rsa = "0.9.10"
aes = "0.9.2"
cfb8 = "0.9.1"
flate2 = "1.1.9"
thiserror = "2.0.19"
take_mut = "0.2.2"
tokio = {version = "1.53.1", features = ["io-util"]}
async-compression = { version = "0.4.43", features = ["tokio", "zlib"] }
